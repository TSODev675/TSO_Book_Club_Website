name: Production CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django checks and tests
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: 'True'
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Validate and build production images
        env:
          SECRET_KEY: ci-only-secret-key
          POSTGRES_DB: tso_bookclub
          POSTGRES_USER: tso_bookclub
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgres://tso_bookclub:ci-only-password@db:5432/tso_bookclub
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure production SSH key
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production
          chmod 600 ~/.ssh/production
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
      - name: Deploy and verify
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
        run: ssh -i ~/.ssh/production -p "$PORT" "$USER@$HOST" 'bash /opt/tso-bookclub/scripts/deploy.sh'
