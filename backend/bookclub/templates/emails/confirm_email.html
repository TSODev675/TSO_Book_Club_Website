<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .container { background: #fff; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; }
    .btn { display: inline-block; padding: 12px 24px; background: #4F46E5; color: #fff; text-decoration: none; border-radius: 6px; margin-top: 20px; }
    .footer { font-size: 12px; color: #999; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome to TSO Book Club, {{ user.first_name|default:user.username }}!</h2>
    <p>Thank you for signing up. Please confirm your email address to activate your account.</p>
    <a href="{{ confirm_url }}" class="btn">Confirm Email</a>
    <p>Or copy this link into your browser:</p>
    <p><small>{{ confirm_url }}</small></p>
    <div class="footer">
      If you did not sign up for TSO Book Club, please ignore this email.
    </div>
  </div>
</body>
</html>
